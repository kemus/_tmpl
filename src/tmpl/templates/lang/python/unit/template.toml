# Python unit layer: applied at each python unit's path.

[options.name]
scope = "unit"
source = "pyproject.toml:project.name"
# default: the unit directory's name (repo name for ".")

[files."src/**"]
policy = "seed"
scaffold = true

[merge."pyproject.toml"]
set_like = { "project.dependencies" = "requirement", "dependency-groups.*" = "requirement", "tool.ruff.lint.ignore" = "exact", "tool.uv.workspace.members" = "exact" }
