# python × scripts: standalone PEP 723 files run with `uv run --script`, not a package.

package = false

[files."*.py"]
policy = "seed"
scaffold = true

[[fragment]]
sink = "readme.sections"
order = 30
data = { title = "Scripts", body = """
Each file in `{{ unit.path }}/` declares its dependencies inline (PEP 723):

```sh
uv run --script {{ unit.path }}/example.py
```""" }

# Their dependencies join the root pyproject's `scripts` group, so checkers and tests see them.
[[fragment]]
sink = "python.scripts"
data = { dir = "{{ unit.path }}" }

# Tests import scripts as modules; with no package, the root pyproject points pytest and the checkers here.
[[fragment]]
sink = "workspace.python"
data.root.tool.pytest.ini_options = { testpaths = ["{{ unit.path }}/tests"], pythonpath = ["{{ unit.path }}"], strict = true }

[[fragment]]
sink = "workspace.python"
when = "{{ 'basedpyright' in (type_checker_fast, type_checker_thorough) }}"
data.root.tool.basedpyright = { extraPaths = ["{{ unit.path }}"] }

[[fragment]]
sink = "workspace.python"
when = "{{ 'pyright' in (type_checker_fast, type_checker_thorough) }}"
data.root.tool.pyright = { extraPaths = ["{{ unit.path }}"] }

[[fragment]]
sink = "workspace.python"
when = "{{ 'mypy' in (type_checker_fast, type_checker_thorough) }}"
data.root.tool.mypy = { mypy_path = ["{{ unit.path }}"] }

[[fragment]]
sink = "workspace.python"
when = "{{ 'ty' in (type_checker_fast, type_checker_thorough) }}"
data.root.tool.ty.environment = { extra-paths = ["{{ unit.path }}"] }
