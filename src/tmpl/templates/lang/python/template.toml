# Python language layer: applied once when any python unit exists.

setup = [["uv", "sync", "--all-packages"]]

[options.python_version]
scope = "lang"
choices = ["3.12", "3.13", "3.14"]
default = "3.14"
source = "pyproject.toml:project.requires-python"
source_pattern = '(\d+\.\d+)'

[options.type_checker_fast]
scope = "lang"
choices = ["basedpyright", "pyright", "ty", "mypy", "none"]
default = "basedpyright"

[options.type_checker_thorough]
scope = "lang"
choices = ["basedpyright", "pyright", "ty", "mypy", "none"]
default = "mypy"

# Checker → hk step. Builtins exist for ty and mypy; the pyrights need a custom step.
[vars.checker_builtin]
ty = "ty"
mypy = "mypy"

[vars.checker_cmd]
basedpyright = "basedpyright"
pyright = "pyright"

[[fragment]]
sink = "mise.tools"
data = { python = "{{ python_version }}", uv = "latest" }

# Activating the venv puts uv-installed dev tools (ruff, type checkers) on PATH for hk and tasks.
[[fragment]]
sink = "mise.env"
data."_.python.venv" = { path = ".venv", create = true }

[[fragment]]
sink = "mise.tasks"
data."lint:python" = { description = "Lint python", run = "uv run ruff check" }
data."fmt:python" = { description = "Format python", run = "uv run ruff format" }
data."test:python" = { description = "Test python", run = "uv run pytest" }

[[fragment]]
sink = "hk.steps"
order = 20
data = { name = "ruff_format", builtin = "ruff_format", hooks = ["pre-commit", "check", "fix"] }

[[fragment]]
sink = "hk.steps"
order = 21
data = { name = "ruff", builtin = "ruff", hooks = ["pre-commit", "check", "fix"] }

[[fragment]]
sink = "hk.steps"
order = 40
when = "{{ type_checker_fast != 'none' }}"
data = { name = "{{ type_checker_fast }}", builtin = "{{ checker_builtin.get(type_checker_fast, '') }}", glob = "{{ '' if type_checker_fast in checker_builtin else '**/*.py' }}", check = "{{ checker_cmd.get(type_checker_fast, '') }}", hooks = ["pre-commit", "check"] }

[[fragment]]
sink = "hk.steps"
order = 41
when = "{{ type_checker_thorough not in ('none', type_checker_fast) }}"
data = { name = "{{ type_checker_thorough }}", builtin = "{{ checker_builtin.get(type_checker_thorough, '') }}", glob = "{{ '' if type_checker_thorough in checker_builtin else '**/*.py' }}", check = "{{ checker_cmd.get(type_checker_thorough, '') }}", hooks = ["pre-push", "check"], slow = true }

[[fragment]]
sink = "gitignore"
order = 20
data = { heading = "Python", lines = ["__pycache__/", "*.py[cod]", "*.egg-info/", ".venv/", "dist/", "build/"] }

[[fragment]]
sink = "editorconfig"
order = 20
data."*.py" = { indent_style = "space", indent_size = "4" }

[[fragment]]
sink = "agents.sections"
order = 20
data = { title = "Python", body = """
- Dependencies and environments via `uv`; run tools with `mise exec -- uv run <tool>`.
- Lint/format: ruff. Types: {{ type_checker_fast }}{% if type_checker_thorough not in ('none', type_checker_fast) %} (fast), {{ type_checker_thorough }} (pre-push / CI){% endif %}. Tests: pytest.""" }
