# Python language layer: applied once when any python unit exists.

setup = [["uv", "sync", "--all-packages"]]

[options.python_version]
scope = "lang"
choices = ["3.12", "3.13", "3.14"]
default = "3.14"
source = "pyproject.toml:project.requires-python"
source_pattern = '(\d+\.\d+)'

# Each chosen checker runs at its stage: pre-commit (and `check`), pre-push (and CI), or CI only.
[options.type_checkers]
scope = "lang"
type = "tools"
choices = ["basedpyright", "pyright", "ty", "mypy"]
default = { basedpyright = "pre-commit", mypy = "pre-push" }
replaces = { type_checker_fast = "pre-commit", type_checker_thorough = "pre-push" }

[vars.stage_labels]
pre-commit = "pre-commit"
pre-push = "pre-push / CI"
ci = "CI"

[[fragment]]
sink = "mise.tools"
data = { python = "{{ python_version }}", uv = "latest" }

# Activating the venv puts uv-installed dev tools (ruff, type checkers) on PATH for hk and tasks.
[[fragment]]
sink = "mise.env"
data."_.python.venv" = { path = ".venv", create = true }

[[fragment]]
sink = "mise.tasks"
data."lint:python" = { description = "Lint python", run = "uv run ruff check" }
data."fmt:python" = { description = "Format python", run = "uv run ruff format" }
data."test:python" = { description = "Test python", run = "uv run pytest" }

[[fragment]]
sink = "hk.steps"
order = 20
data = { name = "ruff_format", builtin = "ruff_format", hooks = ["pre-commit", "check", "fix"] }

[[fragment]]
sink = "hk.steps"
order = 21
data = { name = "ruff", builtin = "ruff", hooks = ["pre-commit", "check", "fix"] }

# One step per checker. Builtins exist for ty and mypy; the pyrights need a custom step.
[[fragment]]
sink = "hk.steps"
order = 40
when = "{{ 'basedpyright' in type_checkers }}"
data = { name = "basedpyright", glob = "**/*.py", check = "basedpyright", stage = "{{ type_checkers.basedpyright }}" }

[[fragment]]
sink = "hk.steps"
order = 41
when = "{{ 'pyright' in type_checkers }}"
data = { name = "pyright", glob = "**/*.py", check = "pyright", stage = "{{ type_checkers.pyright }}" }

[[fragment]]
sink = "hk.steps"
order = 42
when = "{{ 'ty' in type_checkers }}"
data = { name = "ty", builtin = "ty", stage = "{{ type_checkers.ty }}" }

[[fragment]]
sink = "hk.steps"
order = 43
when = "{{ 'mypy' in type_checkers }}"
data = { name = "mypy", builtin = "mypy", stage = "{{ type_checkers.mypy }}" }

# Unless a package sits at `.`, the root pyproject holds the dev tools and checker config.
[[fragment]]
sink = "workspace.python"
data.root."dependency-groups".dev = ["pytest", "ruff"]

[[fragment]]
sink = "workspace.python"
when = "{{ 'basedpyright' in type_checkers }}"
data.root."dependency-groups".dev = ["basedpyright"]
data.root.tool.basedpyright = { typeCheckingMode = "strict", venvPath = ".", venv = ".venv" }

[[fragment]]
sink = "workspace.python"
when = "{{ 'pyright' in type_checkers }}"
data.root."dependency-groups".dev = ["pyright"]
data.root.tool.pyright = { typeCheckingMode = "strict", venvPath = ".", venv = ".venv" }

[[fragment]]
sink = "workspace.python"
when = "{{ 'mypy' in type_checkers }}"
data.root."dependency-groups".dev = ["mypy"]
data.root.tool.mypy = { strict = true }

[[fragment]]
sink = "workspace.python"
when = "{{ 'ty' in type_checkers }}"
data.root."dependency-groups".dev = ["ty"]

[[fragment]]
sink = "gitignore"
order = 20
data = { heading = "Python", lines = ["__pycache__/", "*.py[cod]", "*.egg-info/", ".venv/", "dist/", "build/"] }

[[fragment]]
sink = "editorconfig"
order = 20
data."*.py" = { indent_style = "space", indent_size = "4" }

[[fragment]]
sink = "agents.sections"
order = 20
data = { title = "Python", body = """
- Dependencies and environments via `uv`; run tools with `mise exec -- uv run <tool>`.
- Lint/format: ruff. Types: {% for tool, stage in type_checkers.items() %}{{ tool }} ({{ stage_labels[stage] }}){% if not loop.last %}, {% endif %}{% else %}none{% endfor %}. Tests: pytest.""" }
