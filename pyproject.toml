[project]
name = "tmpl"
version = "0.9.1"
description = "Composable, updatable project templates"
authors = [{ name = "kemus" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "attrs>=26.1.0",
    "cattrs>=26.2.0",
    "cyclopts>=4.25.3",
    "jinja2>=3.1.6",
    "ruamel-yaml>=0.19.1",
    "tomlkit>=0.15.1",
]

[project.scripts]
tmpl = "tmpl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tmpl"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D",       # pydocstyle — not enforced
  "COM812",  # trailing comma — conflicts with formatter
  "ISC001",  # implicit string concat — conflicts with formatter
  "CPY001",  # copyright header — the LICENSE file covers the repo
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
strict = true

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
