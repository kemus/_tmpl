
# = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
# mypy — static type checker for Python
# Reference: https://mypy.readthedocs.io/en/latest/config_file.html
# = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = = =
# Target Python version for type analysis
# Type: str | Default: platform default
[mypy]
plugins = pydantic.mypy
mypy_path = typings
files = src/**/*.py,tests/**/*.py
# Enable all optional strict error checking flags
# Enables:
#   --check-untyped-defs,
#   --disallow-any-generics,
#   --disallow-incomplete-defs,
#   --disallow-subclassing-any,
#   --disallow-untyped-calls,
#   --disallow-untyped-decorators,
#   --disallow-untyped-defs,
#   --extra-checks
#   --no-implicit-reexport,
#   --strict-bytes,
#   --strict-equality,
#   --warn-redundant-casts,
#   --warn-return-any,
#   --warn-unused-configs,
#   --warn-unused-ignores,
# Type: bool | Default: false
strict = true
allow_redefinition_new = false
allow_redefinition = false
allow_untyped_globals = false
always_false = []
always_true = ["DEBUG"]
# any_exprs_report =
cache_dir = ".cache/mypy"
cache_fine_grained = true
# check_untyped_defs = true
color_output = true
custom_typing_module = ""
deprecated_calls_exclude = ""
# disable_error_code = ""
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_expr = false
# disallow_any_generics = true
disallow_any_unimported = true
# disallow_incomplete_defs = true
# disallow_subclassing_any = true
# disallow_untyped_calls = true
# disallow_untyped_decorators = true
# disallow_untyped_defs = true
# enable_error_code = "ALL"
error_summary = true
exclude_gitignore = true
explicit_package_bases = false
# extra_checks = true
follow_imports_for_stubs = true
follow_imports = normal
follow_untyped_imports = true
hide_error_codes = false
ignore_errors = false
ignore_missing_imports = false
implicit_optional = true
implicit_reexport = true
incremental = true
# linecount_report =
# linecoverage_report =
# lineprecision_report =
local_partial_types = true
namespace_packages = true
# no_implicit_reexport = true
no_silence_site_packages = false
no_site_packages = false
pdb = false
platform = "Linux"
pretty = true
python_version = 3.14
raise_exceptions = true
scripts_are_modules = false
show_absolute_path = false
show_column_numbers = true
show_error_code_links = true
show_error_context = true
show_traceback = true
skip_cache_mtime_checks = false
skip_version_check = false
sqlite_cache = true
# strict_bytes = true
# strict_equality = true
strict_equality_for_none = true
strict_optional = true
#untyped_calls_exclude = ""
verbosity = 0
warn_incomplete_stub = true
warn_no_return = true
# warn_redundant_casts = true
# warn_return_any = true
warn_unreachable = true
# warn_unused_configs = true
# warn_unused_ignores = true

# Pydantic generates __init__ methods with **kwargs: Any which triggers
# disallow_any_explicit. This is a known Pydantic + mypy strict mode issue.
[mypy-llmstxt_scraper.config.*]
disallow_any_explicit = false
