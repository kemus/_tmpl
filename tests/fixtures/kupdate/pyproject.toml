[project]
name = "kupdate"
version = "0.1.0"
description = "Sequential workstation updater; configuration inspection CLI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "cyclopts>=4",
  "rich>=14",
  "structlog>=25",
  "tomlkit>=0.13",
]

[project.scripts]
kupdate = "kupdate.cli:main"

[project.optional-dependencies]
git = ["dulwich>=0.24"]

[dependency-groups]
dev = [
  "basedpyright>=1.30",
  "mypy>=1.15",
  "pytest>=9",
  "ruff>=0.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kupdate"]
