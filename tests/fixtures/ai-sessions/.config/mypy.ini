[mypy]
files = $MYPY_CONFIG_FILE_DIR/../scripts, $MYPY_CONFIG_FILE_DIR/../tests
mypy_path = $MYPY_CONFIG_FILE_DIR/../scripts
cache_dir = $MYPY_CONFIG_FILE_DIR/../.venv/.mypy_cache
python_version = 3.14
strict = True
warn_unreachable = True
disallow_any_unimported = True
disallow_any_decorated = True
disallow_any_explicit = True
disallow_any_expr = True
enable_error_code = deprecated, exhaustive-match, explicit-override, ignore-without-code, mutable-override, possibly-undefined, redundant-expr, redundant-self, truthy-bool, truthy-iterable, unimported-reveal, unused-awaitable

# pytest.fixture is an overloaded function whose type contains Any, so every
# use of it is an Any expression.
[mypy-tests.*]
disallow_any_expr = False
